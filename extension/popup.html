<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Download Router</title>
  <link rel="stylesheet" href="popup.css">
  <script src="lib/validation.js"></script>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand-tile" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v6.5"/><path d="M7 18.5v-6a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v6"/><path d="M4.8 16.3L7 18.7l2.2-2.4"/><path d="M14.8 16.3l2.2 2.4 2.2-2.4"/></svg>
      </div>
      <h1 class="app-name">Download Router</h1>
      <button type="button" class="switch" id="toggle-extension-header" role="switch" aria-checked="true" aria-label="Sort downloads" title="Sorting is on"></button>
    </header>

    <p class="paused-note" id="paused-banner" role="status" hidden>Paused. Downloads save to Downloads as usual.</p>

    <section class="section" aria-label="Recent downloads">
      <div class="section-head">
        <h2 class="section-label" id="recent-heading">Recent</h2>
        <button type="button" class="plain small" id="clear-activity" hidden>Clear</button>
      </div>
      <div class="recent" id="activity-list"></div>
    </section>

    <section class="section" aria-labelledby="site-heading">
      <div class="section-head">
        <h2 class="section-label" id="site-heading">This site</h2>
      </div>
      <div class="list site" id="site-card">
        <div class="site-row">
          <span class="tile" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.3 2.4 3.4 5.2 3.4 8.5s-1.1 6.1-3.4 8.5M12 3.5C9.7 5.9 8.6 8.7 8.6 12s1.1 6.1 3.4 8.5"/></svg>
          </span>
          <p class="site-text" id="site-text" aria-live="polite"></p>
          <button type="button" class="plain" id="site-change" aria-haspopup="menu" aria-expanded="false" hidden>Change</button>
        </div>
      </div>
    </section>

    <footer class="footer">
      <span class="footer-status" id="sorting-status"></span>
      <a href="#" class="plain small" id="open-options-header">Settings</a>
    </footer>
  </div>

  <div class="menu" id="folder-menu" role="menu" aria-label="Folders" hidden></div>

  <script src="popup.js"></script>
</body>
</html>
